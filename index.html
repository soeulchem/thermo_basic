<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열 연구소 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 네오브루탈리즘 방탈출. 상단 전광판(마퀴) → 제목 + 금고문 → 온도계 게이지 → 잠금 패널 한 장. 굵은 검정 테두리, 어긋남 없는 하드 섀도, 평면 원색. 단일 라이트 룩으로 고정. */
:root {
  color-scheme: light;
  --paper: #d6e6ff;
  --dot: rgba(11, 11, 18, 0.2);
  --white: #ffffff;
  --ink: #0b0b12;
  --yellow: #ffd93d;
  --hot: #ff5a2c;
  --cold: #3d8bff;
  --mint: #38e0a0;
  --pink: #ff7ab8;
  --blush: #ffc9dc;
  --ice: #c4dcff;
  --bad: #ff3b5c;
  --bw: 3px;
  --sh: 5px 5px 0 var(--ink);
  --sh-lg: 9px 9px 0 var(--ink);
  --f-display: "Black Han Sans", "Noto Sans KR", "Pretendard", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Noto Sans KR", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 500;
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 18px 56px;
  overflow-x: hidden;
}
.wrap { max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 4.6vw, 31px); line-height: 1.3; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
sub { font-size: 0.72em; line-height: 0; }
.lead { max-width: 62ch; font-weight: 500; }
b, strong { font-weight: 900; }

/* marquee */
.marquee { border: var(--bw) solid var(--ink); background: var(--yellow); overflow: hidden; box-shadow: var(--sh); }
.marquee .track { display: flex; width: max-content; animation: marquee 22s linear infinite; }
.marquee span { padding: 6px 0; font-family: var(--f-display); font-size: 17px; white-space: nowrap; padding-right: 2.2em; }

/* header */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: center; }
.hero-text { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; min-width: 0; }
.sticker {
  display: inline-block; font-family: var(--f-display); font-size: 15px; padding: 3px 12px;
  background: var(--pink); border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-3deg); animation: wiggle 3.2s ease-in-out infinite;
}
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 9.5vw, 78px); line-height: 1.05; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
h1 .l1, h1 .l2 { display: inline-block; padding: 0 14px; border: var(--bw) solid var(--ink); box-shadow: var(--sh-lg); }
h1 .l1 { background: var(--white); transform: rotate(-1.5deg); animation: slam 0.7s 0.05s cubic-bezier(.2,1.4,.4,1) both; }
h1 .l2 { background: var(--hot); transform: rotate(1deg); margin-left: 18px; animation: slam 0.7s 0.2s cubic-bezier(.2,1.4,.4,1) both; }
.timer {
  font-family: var(--f-mono); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums;
  padding: 4px 16px; background: var(--white); border: var(--bw) solid var(--ink); box-shadow: var(--sh);
}
.timer.warn { background: var(--yellow); animation: pulse 1s steps(2, jump-none) infinite; }
.timer.over { background: var(--bad); color: var(--white); }
.hero-side { display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* vault door */
.vault { position: relative; width: 150px; height: 170px; perspective: 700px; }
.vault .back {
  position: absolute; inset: 0; border: var(--bw) solid var(--ink); background: var(--ink);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.vault .back i {
  position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg, var(--yellow) 0 10deg, transparent 10deg 20deg);
  opacity: 0; animation: spin 8s linear infinite;
}
.vault.open .back i { opacity: 0.9; }
.vault .back em { position: relative; font-family: var(--f-display); font-style: normal; color: var(--ink); font-size: 24px; background: var(--white); border: var(--bw) solid var(--ink); padding: 0 8px; opacity: 0; }
.vault.open .back em { opacity: 1; animation: slam 0.6s 0.7s cubic-bezier(.2,1.4,.4,1) both; }
.vault .door {
  position: absolute; inset: 0; background: var(--cold); border: var(--bw) solid var(--ink); box-shadow: var(--sh);
  transform-origin: left center; display: flex; align-items: center; justify-content: center; backface-visibility: hidden;
}
.vault.open .door { animation: dooropen 1.1s 0.2s cubic-bezier(.3,1.2,.5,1) forwards; }
.wheel { width: 96px; height: 96px; animation: spin 10s linear infinite; }
.vault.open .wheel { animation-duration: 1.2s; }
.wheel * { stroke: var(--ink); stroke-width: 5; fill: none; stroke-linecap: square; }
.wheel .hub { fill: var(--yellow); }
.bolts { position: absolute; left: 8px; top: 12px; bottom: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.bolts u { width: 14px; height: 14px; background: var(--white); border: 3px solid var(--ink); display: block; transition: background .3s; }
.bolts u.on { background: var(--mint); }

/* gauge */
.gauge { display: flex; flex-direction: column; gap: 12px; }
.gauge-track {
  position: relative; height: 34px; border: var(--bw) solid var(--ink); box-shadow: var(--sh); overflow: hidden;
  background: linear-gradient(90deg, #3d8bff, #7fd0ff 30%, #ffd93d 65%, #ff5a2c);
}
.gauge-track::after {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.28) 0 10px, transparent 10px 20px);
  background-size: 28px 28px; animation: stripes 1.2s linear infinite;
}
.gauge-mask { position: absolute; top: 0; right: 0; bottom: 0; z-index: 3; background: var(--white); border-left: var(--bw) solid var(--ink); transition: width 0.9s cubic-bezier(.3,1.4,.5,1); }
.gauge-mask.full { border-left: 0; }
.gauge-ticks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tick {
  display: flex; flex-direction: column; font-family: var(--f-display); font-size: 14px; line-height: 1.25;
  padding: 5px 8px; background: var(--white); border: var(--bw) solid var(--ink); min-width: 0;
}
.tick small { font-family: var(--f-body); font-weight: 900; font-size: 12px; letter-spacing: 0.04em; }
.tick.cur { background: var(--yellow); }
.tick.on { background: var(--mint); }
.tick.pop { animation: pop 0.6s cubic-bezier(.2,1.6,.4,1); }

/* panels */
main { display: block; }
.panel {
  position: relative; background: var(--white); border: 4px solid var(--ink); box-shadow: var(--sh-lg);
  padding: 34px 22px 24px; display: flex; flex-direction: column; gap: 18px;
  animation: slam 0.55s cubic-bezier(.2,1.3,.4,1) both;
}
.panel.shake { animation: shake 0.45s both; }
.tag {
  position: absolute; top: -18px; left: 14px; font-family: var(--f-display); font-size: 17px; padding: 2px 14px;
  border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg);
}
.t-hot { background: var(--hot); } .t-cold { background: var(--cold); } .t-mint { background: var(--mint); } .t-yellow { background: var(--yellow); } .t-pink { background: var(--pink); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* buttons */
button, select, input { font: inherit; color: inherit; }
.btn {
  background: var(--yellow); border: var(--bw) solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px 22px; min-height: 48px;
  font-family: var(--f-display); font-size: 19px; cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.btn.cold { background: var(--ice); font-size: 16px; min-height: 42px; padding: 6px 16px; }
.btn.go { background: var(--mint); }
.btn:disabled { background: #e1e1e6; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--ink); opacity: .6; }
.linkbtn { background: none; border: none; font-weight: 900; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }
:focus-visible { outline: 4px solid var(--pink); outline-offset: 3px; }

/* feedback */
.fb { padding: 12px 16px; border: var(--bw) solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font-weight: 700; background: var(--white); animation: pop 0.4s cubic-bezier(.2,1.6,.4,1); }
.fb.ok { background: var(--mint); }
.fb.bad { background: var(--blush); }
.fb.hint { background: var(--ice); }
.fb[hidden] { display: none; }
.okrow { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.okrow .msg { flex: 1 1 240px; min-width: 0; }
.padlock { width: 44px; height: 52px; flex: none; }
.padlock .shackle { fill: none; stroke: var(--ink); stroke-width: 6; transform-box: fill-box; transform-origin: 0 100%; }
.padlock .pl-body { fill: var(--yellow); stroke: var(--ink); stroke-width: 4; }
.padlock .pl-key { fill: var(--ink); }
.padlock.open { animation: bounce .7s .1s; }
.padlock.open .shackle { animation: unlock .5s .1s cubic-bezier(.3,1.6,.5,1) forwards; }

/* lock 1 */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.card {
  border: var(--bw) solid var(--ink); background: var(--white); box-shadow: var(--sh); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  animation: slam 0.5s calc(var(--i, 0) * 70ms + 0.15s) cubic-bezier(.2,1.4,.4,1) both;
}
.card.right { background: #c9f8e4; }
.card.wrong { background: var(--blush); animation: shake .45s both; }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card .nm { font-family: var(--f-display); font-size: 19px; line-height: 1.3; }
.card .ds { font-size: 14.5px; font-weight: 500; }
.card .obs { font-size: 14px; font-weight: 900; padding: 3px 10px; background: var(--yellow); border: 2px solid var(--ink); align-self: flex-start; }
.thermo { width: 30px; height: 62px; flex: none; }
.thermo .tb { fill: var(--white); stroke: var(--ink); stroke-width: 3; }
.thermo .bulb { fill: var(--hot); stroke: var(--ink); stroke-width: 3; }
.thermo .merc { fill: var(--hot); transform-box: fill-box; transform-origin: bottom; }
.thermo.up .merc { animation: mrise 2.6s ease-in-out infinite; }
.thermo.down .merc { animation: mfall 2.6s ease-in-out infinite; }
.thermo.down .bulb, .thermo.down .merc { fill: var(--cold); }
.flame { width: 34px; height: 56px; flex: none; }
.flame path { stroke: var(--ink); stroke-width: 3; transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 0.7s ease-in-out infinite alternate; }
.flame .f1 { fill: var(--hot); } .flame .f2 { fill: var(--yellow); animation-duration: 0.5s; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  display: flex; align-items: center; justify-content: center; min-height: 46px; background: var(--white); border: var(--bw) solid var(--ink);
  font-family: var(--f-display); font-size: 18px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.seg label:hover { transform: translate(-1px, -1px); }
.seg input:focus-visible + label { outline: 4px solid var(--pink); outline-offset: 3px; }
.seg input:checked + label { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.seg input[value="exo"]:checked + label { background: var(--hot); }
.seg input[value="endo"]:checked + label { background: var(--cold); }

/* options */
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border: var(--bw) solid var(--ink); background: var(--white); cursor: pointer; min-height: 48px; box-shadow: 3px 3px 0 var(--ink); }
.opt input { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--ink); flex: none; }
.opt:has(input:checked) { background: var(--yellow); transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.opt:has(input:focus-visible) { outline: 4px solid var(--pink); outline-offset: 3px; }

/* lock 2 */
.diagrams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.dg { border: var(--bw) solid var(--ink); background: var(--ice); box-shadow: var(--sh); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dg svg { width: 100%; height: auto; max-width: 100%; display: block; background: var(--white); border: 2px solid var(--ink); }
.dg .t { fill: var(--ink); font-family: var(--f-body); font-weight: 900; font-size: 12.5px; }
.dg .tm { fill: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: 11px; }
.dg .ax { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dg .gr { stroke: #c9ccd6; stroke-width: 1; }
.dg .bar { fill: var(--ink); transform-box: fill-box; transform-origin: left center; animation: grow 0.6s both; }
.dg .ds2 { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 5; transform-box: fill-box; transform-origin: left center; animation: grow 0.6s 0.5s both; }
.dg .arr { stroke: var(--hot); stroke-width: 5; fill: none; stroke-dasharray: var(--len); stroke-dashoffset: 0; animation: draw 0.8s 1s both; }
.dg .arrhead { fill: var(--hot); stroke: var(--ink); stroke-width: 2; animation: fadein 0.3s 1.7s both; }
.dg .lb { animation: fadein 0.4s 0.5s both; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-family: var(--f-display); font-size: 17px; }
.inp {
  font-family: var(--f-mono); font-weight: 700; font-size: 22px; padding: 8px 12px; min-height: 54px; width: 100%;
  border: var(--bw) solid var(--ink); background: var(--white); box-shadow: var(--sh); font-variant-numeric: tabular-nums;
}
.inp::placeholder { color: #8a8a99; font-weight: 500; }
.inp.good { background: #c9f8e4; }
.inp.badv { background: var(--blush); }

/* lock 3 */
.tbl-wrap { overflow-x: auto; border: var(--bw) solid var(--ink); box-shadow: var(--sh); background: var(--white); }
table { border-collapse: collapse; width: 100%; min-width: 540px; font-size: 15px; }
th, td { border: 2px solid var(--ink); padding: 8px 12px; text-align: left; vertical-align: middle; }
th { background: var(--yellow); font-family: var(--f-display); font-weight: 400; font-size: 15px; }
td.eq { font-family: var(--f-mono); font-weight: 700; font-size: 14px; white-space: nowrap; }
td.q { font-family: var(--f-display); background: var(--blush); font-size: 18px; animation: pulse 1.2s steps(2, jump-none) infinite; }
.eqbox { font-family: var(--f-mono); font-weight: 700; font-size: clamp(15px, 3.7vw, 22px); padding: 16px 18px; border: var(--bw) solid var(--ink); background: var(--yellow); box-shadow: var(--sh); overflow-x: auto; white-space: nowrap; }

/* final */
.sent { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 16px; border: var(--bw) solid var(--ink); background: var(--white); box-shadow: var(--sh); font-weight: 700; }
.sent .no { font-family: var(--f-display); background: var(--ink); color: var(--white); padding: 0 10px; margin-right: 4px; }
.sent select { padding: 6px 10px; min-height: 44px; border: var(--bw) solid var(--ink); background: var(--ice); font-weight: 900; max-width: 100%; cursor: pointer; }
.sent select.wrongsel { background: var(--blush); animation: shake .4s both; }
.sent select.rightsel { background: #c9f8e4; }

/* clear */
.stats { display: flex; flex-wrap: wrap; gap: 16px; }
.stat { flex: 1 1 150px; border: var(--bw) solid var(--ink); box-shadow: var(--sh); padding: 10px 16px; }
.stat:nth-child(1) { background: var(--ice); } .stat:nth-child(2) { background: var(--blush); }
.stat b { display: block; font-family: var(--f-mono); font-size: 30px; font-variant-numeric: tabular-nums; }
.stat span { font-weight: 900; font-size: 13px; }
.qs { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-weight: 700; }
.terms { display: flex; flex-wrap: wrap; gap: 10px; }
.term { padding: 3px 14px; border: var(--bw) solid var(--ink); font-family: var(--f-display); font-size: 16px; box-shadow: 3px 3px 0 var(--ink); animation: pop .5s calc(var(--i) * 90ms + .6s) cubic-bezier(.2,1.6,.4,1) both; }
.term:nth-child(1) { background: var(--hot); } .term:nth-child(2) { background: var(--cold); } .term:nth-child(3) { background: var(--yellow); }
.term:nth-child(4) { background: var(--mint); } .term:nth-child(5) { background: var(--pink); }
.clearhead { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; }

.foot { display: flex; justify-content: flex-end; }
#cf { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* keyframes */
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.06); } }
@keyframes slam { 0% { opacity: 0; transform: translateY(36px) rotate(-3deg) scale(0.95); } 60% { opacity: 1; transform: translateY(-6px) rotate(0.6deg) scale(1.01); } 100% { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 15% { transform: translateX(-10px) rotate(-0.6deg); } 35% { transform: translateX(9px) rotate(0.6deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
@keyframes pulse { 50% { filter: brightness(1.25); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes stripes { to { background-position: 28px 0; } }
@keyframes dooropen { to { transform: rotateY(-78deg); } }
@keyframes bounce { 0%, 100% { transform: none; } 40% { transform: translateY(-10px) rotate(-6deg); } 70% { transform: translateY(2px); } }
@keyframes unlock { to { transform: translateY(-9px) rotate(-28deg); } }
@keyframes mrise { 0% { transform: scaleY(0.25); } 70%, 100% { transform: scaleY(1); } }
@keyframes mfall { 0% { transform: scaleY(1); } 70%, 100% { transform: scaleY(0.25); } }
@keyframes flicker { from { transform: scale(1, 0.88) rotate(-3deg); } to { transform: scale(0.94, 1.08) rotate(3deg); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; }
  .hero-side { flex-direction: row; justify-content: space-between; width: 100%; }
  .vault { width: 110px; height: 130px; }
  .wheel { width: 70px; height: 70px; }
  .gauge-ticks { grid-template-columns: repeat(2, 1fr); }
  .panel { padding: 32px 14px 20px; }
  .clearhead { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<canvas id="cf" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="marquee" aria-hidden="true"><div class="track" id="mq"></div></div>

  <header class="hero">
    <div class="hero-text">
      <span class="sticker">물질과 에너지 · 3단원 도입</span>
      <h1><span class="l1">열 연구소</span><span class="l2">탈출</span></h1>
    </div>
    <div class="hero-side">
      <div class="timer" id="timer" role="timer" aria-label="남은 시간">08:00</div>
      <div class="vault" id="vault" aria-hidden="true">
        <div class="back"><i></i><em>EXIT</em></div>
        <div class="door">
          <div class="bolts"><u></u><u></u><u></u></div>
          <svg class="wheel" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38"/><path d="M50 12V88M12 50H88M23 23L77 77M77 23L23 77"/><circle class="hub" cx="50" cy="50" r="12"/></svg>
        </div>
      </div>
    </div>
  </header>

  <div class="gauge" aria-label="탈출 진행도">
    <div class="gauge-track"><div class="gauge-mask" id="mask" style="width:100%"></div></div>
    <div class="gauge-ticks" id="ticks"></div>
  </div>

  <main id="main"></main>

  <div class="foot"><button class="linkbtn" id="rbtn" type="button">처음부터 다시</button></div>
</div>

<script>
(function () {
  var K = JSON.parse(atob('eyJjIjoiWE5YTlhOIiwicGIiOiJkb3duIiwiYSI6Wy05MCw3MF0sInEiOiJiIiwiciI6LTU3MiwiZiI6WzEsMSwwLDIsMV19'));
  var LIMIT = 480;
  var state = { stage: 'intro', opened: 0, hints: 0, start: 0, end: 0, hintIdx: {}, pop: -1 };
  var timerId = null;
  var main = document.getElementById('main');

  var LABELS = ['잠금 1', '잠금 2', '잠금 3', '최종 문'];
  var SUBS = ['온도 기록', '에너지 도표', '반응식', '규칙 완성'];

  var CARDS = [
    { n: '철가루 핫팩', d: '봉지를 뜯어 공기와 닿게 하면 철이 산화된다.', o: '주머니가 따뜻해진다', v: 'up' },
    { n: '냉찜질팩', d: '안쪽 주머니를 터뜨려 질산 암모늄(NH<sub>4</sub>NO<sub>3</sub>)을 물에 녹인다.', o: '팩이 차가워진다', v: 'down' },
    { n: '양초', d: '파라핀이 산소와 반응하여 탄다.', o: '주변이 따뜻해진다', v: 'up' },
    { n: '베이킹소다 + 구연산', d: '물에 넣어 섞으면 이산화 탄소(CO<sub>2</sub>) 기포가 생긴다.', o: '용액이 차가워진다', v: 'down' },
    { n: '염화 칼슘 제습제', d: '염화 칼슘(CaCl<sub>2</sub>)이 물에 녹는다.', o: '용액이 따뜻해진다', v: 'up' },
    { n: '베이킹소다 가열', d: '가열하면 탄산수소 나트륨(NaHCO<sub>3</sub>)이 분해되어 CO<sub>2</sub>가 나온다. 가열을 멈추면 반응도 멈춘다.', o: '계속 열을 공급해야 한다', v: 'feed' }
  ];

  var HINTS = {
    1: ['주변의 온도가 올라갔다면 열은 물질에서 주변으로 나갔을까, 주변에서 물질로 들어왔을까?',
        '계속 열을 공급해야 하는 반응은 열을 내놓을까, 받아들일까?',
        '에너지는 새로 생기거나 사라지지 않는다. 열이 밖으로 나간 만큼 물질이 가진 에너지는 어떻게 되었을까?'],
    2: ['도표에서 화살표가 위로 향하는지 아래로 향하는지 먼저 확인하자.',
        '변화량은 나중 값에서 처음 값을 뺀 것이다. 처음은 반응물, 나중은 생성물이다.'],
    3: ['(가)와 (나)에서 서로 다른 것은 생성물의 무엇인가?',
        '(다)는 (가)보다 H<sub>2</sub>가 몇 배 반응하는지 세어 보자. 부호는 발열인지 흡열인지로 정한다.'],
    4: ['앞의 세 잠금에서 직접 구한 값과 도표의 화살표 방향을 떠올리자.',
        '(가)에서 방출한 열을 ΔH로 쓸 때 부호가 어떻게 되었는지 확인하자.']
  };

  /* ---------- helpers ---------- */
  function fmt(sec) {
    var s = Math.abs(sec), m = Math.floor(s / 60), r = s % 60;
    return (sec < 0 ? '+' : '') + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }
  function parseNum(s) {
    var t = String(s).replace(/[−–—﹣－]/g, '-').replace(/kj/ig, '').replace(/\s+/g, '').replace(/^\+/, '');
    if (t === '' || t === '-' || isNaN(Number(t))) return NaN;
    return Number(t);
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function shake(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function fb(el, kind, html) {
    el.className = 'fb ' + kind; el.innerHTML = html; el.hidden = false;
    if (kind === 'bad') shake(el.closest('.panel'));
  }

  (function () {
    var t = '◆ 출입 통제 ◆ 열 연구소 ◆ 잠금 3개 + 최종 문 ◆ 제한 시간 8분 ◆ ΔH = ? ';
    var h = '';
    for (var i = 0; i < 4; i++) h += '<span>' + t + '</span>';
    document.getElementById('mq').innerHTML = h;
  })();

  function renderGauge() {
    var pct = Math.round(state.opened / 4 * 100);
    var mk = document.getElementById('mask');
    mk.style.width = (100 - pct) + '%';
    mk.classList.toggle('full', pct === 100);
    var cur = typeof state.stage === 'number' ? state.stage - 1 : -1;
    document.getElementById('ticks').innerHTML = LABELS.map(function (l, i) {
      var cls = 'tick' + (i < state.opened ? ' on' : '') + (i === cur && i >= state.opened ? ' cur' : '') + (i === state.pop ? ' pop' : '');
      return '<div class="' + cls + '">' + l + '<small>' + (i < state.opened ? 'OPEN' : SUBS[i]) + '</small></div>';
    }).join('');
    state.pop = -1;
    document.querySelectorAll('.bolts u').forEach(function (u, i) { u.classList.toggle('on', i < state.opened); });
  }

  function tickTimer() {
    if (!state.start || state.end) return;
    var left = LIMIT - Math.floor((Date.now() - state.start) / 1000);
    var el = document.getElementById('timer');
    el.textContent = fmt(left);
    el.classList.toggle('warn', left <= 60 && left >= 0);
    el.classList.toggle('over', left < 0);
  }

  function go(stage) {
    state.stage = stage;
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function hintBlock() {
    return '<div class="stack"><div class="row"><button class="btn cold" type="button" data-act="hint">힌트 보기</button>' +
      '<span style="font-size:14px;font-weight:700">힌트를 쓰면 기록에 남는다.</span></div>' +
      '<div class="stack" id="hints"></div></div>';
  }
  function showHint(stage) {
    var list = HINTS[stage] || [];
    var idx = state.hintIdx[stage] || 0;
    if (idx >= list.length) return;
    state.hintIdx[stage] = idx + 1;
    state.hints++;
    var d = document.createElement('div');
    d.className = 'fb hint';
    d.innerHTML = '힌트 ' + (idx + 1) + '. ' + list[idx];
    $('#hints').appendChild(d);
    if (idx + 1 >= list.length) { var b = $('[data-act="hint"]'); if (b) b.disabled = true; }
  }

  function padlock(open) {
    return '<svg class="padlock' + (open ? ' open' : '') + '" viewBox="0 0 48 58" aria-hidden="true"><path class="shackle" d="M13 27V17a11 11 0 0 1 22 0v10"/><rect class="pl-body" x="5" y="27" width="38" height="27"/><circle class="pl-key" cx="24" cy="39" r="4.5"/></svg>';
  }

  function thermo(v) {
    if (v === 'feed') {
      return '<svg class="flame" viewBox="0 0 34 56" aria-hidden="true"><path class="f1" d="M17 3C26 16 31 24 31 36a14 14 0 0 1-28 0C3 28 9 24 11 14c3 3 4 5 5 8 2-5 2-12 1-19z"/><path class="f2" d="M17 28c5 6 8 10 8 15a8 8 0 0 1-16 0c0-5 4-8 8-15z"/></svg>';
    }
    return '<svg class="thermo ' + v + '" viewBox="0 0 30 62" aria-hidden="true"><rect class="tb" x="9" y="3" width="12" height="40" rx="6"/><circle class="bulb" cx="15" cy="49" r="9"/><rect class="merc" x="12.5" y="9" width="5" height="40"/></svg>';
  }

  /* ---------- stages ---------- */
  function stageIntro() {
    return '<section class="panel">' +
      '<div class="tag t-yellow">상황</div>' +
      '<h2>실험 도중 연구소의 출입문이 잠겼다</h2>' +
      '<p class="lead">문을 열려면 잠금 세 개를 풀고 최종 문의 규칙을 완성해야 한다. 잠금마다 직접 관찰하고 계산한 결과가 열쇠가 된다.</p>' +
      '<div class="fb">제한 시간은 8분이다. 시간이 지나도 계속 풀 수 있다. 모둠원 모두가 의견을 말한 뒤 답을 입력하자.</div>' +
      '<div class="row"><button class="btn" type="button" data-act="start">탈출 시작</button></div>' +
      '</section>';
  }

  function stage1() {
    var cards = CARDS.map(function (c, i) {
      return '<div class="card" id="card' + i + '" style="--i:' + i + '"><div class="card-top"><div class="nm">' + c.n + '</div>' + thermo(c.v) + '</div>' +
        '<div class="ds">' + c.d + '</div>' +
        '<div class="obs">관찰: ' + c.o + '</div>' +
        '<div class="seg" role="radiogroup" aria-label="' + c.n + ' 분류">' +
        '<input type="radio" name="c' + i + '" id="c' + i + 'x" value="exo"><label for="c' + i + 'x">발열</label>' +
        '<input type="radio" name="c' + i + '" id="c' + i + 'n" value="endo"><label for="c' + i + 'n">흡열</label>' +
        '</div></div>';
    }).join('');
    return '<section class="panel">' +
      '<div class="tag t-hot">잠금 1 · 온도 기록실</div>' +
      '<h2>기록부의 관찰 결과를 보고 여섯 가지 변화를 분류하라</h2>' +
      '<p class="lead">열을 내놓는 변화는 발열, 열을 받아들이는 변화는 흡열로 분류한다.</p>' +
      '<div class="cards">' + cards + '</div>' +
      '<div class="row"><button class="btn" type="button" data-act="check1">분류 확인</button></div>' +
      '<div class="fb" id="fb1" hidden></div>' +
      '<div id="partB" class="stack" hidden>' +
        '<h3>추가 질문</h3>' +
        '<p style="font-weight:700">핫팩이 따뜻해지는 동안, 반응에 참여한 물질(반응물이 생성물로 바뀌는 계)이 가진 에너지는 어떻게 되었을까?</p>' +
        '<div class="opts" role="radiogroup" aria-label="핫팩 반응 물질의 에너지">' +
          '<label class="opt"><input type="radio" name="pb" value="up"><span>반응 전보다 늘어난다.</span></label>' +
          '<label class="opt"><input type="radio" name="pb" value="down"><span>반응 전보다 줄어든다.</span></label>' +
          '<label class="opt"><input type="radio" name="pb" value="same"><span>변하지 않는다.</span></label>' +
        '</div>' +
        '<div class="row"><button class="btn" type="button" data-act="checkB">답 확인</button></div>' +
        '<div class="fb" id="fbB" hidden></div>' +
      '</div>' +
      hintBlock() +
      '</section>';
  }

  function diagram(title, r, p) {
    var W = 290, H = 250, yb = 214, sc = 1.15;
    function y(v) { return yb - v * sc; }
    var xr = 70, xp = 190, bw = 64;
    var ticks = [0, 50, 100, 150].map(function (v) {
      return '<line class="gr" x1="38" x2="280" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="tm" x="32" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    }).join('');
    var dir = p > r ? 1 : -1;
    var tip = y(p), tail = y(r);
    var len = Math.abs((tip + dir * 8) - tail);
    var head = '<polygon class="arrhead" points="262,' + tip + ' 253,' + (tip + dir * 13) + ' 271,' + (tip + dir * 13) + '"/>';
    return '<div class="dg"><h3>' + title + '</h3>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + title + ' 엔탈피 도표: 반응물 ' + r + ', 생성물 ' + p + '">' +
      ticks +
      '<line class="ax" x1="38" y1="' + yb + '" x2="38" y2="14"/>' +
      '<text class="t" x="44" y="22">H</text>' +
      '<line class="ds2" x1="' + xr + '" x2="253" y1="' + tail + '" y2="' + tail + '"/>' +
      '<rect class="bar" x="' + xr + '" y="' + (y(r) - 3) + '" width="' + bw + '" height="6"/>' +
      '<rect class="bar" style="animation-delay:.2s" x="' + xp + '" y="' + (y(p) - 3) + '" width="' + bw + '" height="6"/>' +
      '<text class="t lb" x="' + (xr + bw / 2) + '" y="' + (y(r) - 10) + '" text-anchor="middle">반응물 ' + r + '</text>' +
      '<text class="t lb" x="' + (xp + bw / 2) + '" y="' + (y(p) - 10) + '" text-anchor="middle">생성물 ' + p + '</text>' +
      '<line class="arr" style="--len:' + len + '" x1="262" x2="262" y1="' + tail + '" y2="' + (tip + dir * 8) + '"/>' + head +
      '<text class="tm" x="46" y="' + (yb + 22) + '">가상 눈금 (kJ)</text>' +
      '</svg></div>';
  }

  function stage2() {
    return '<section class="panel">' +
      '<div class="tag t-cold">잠금 2 · 에너지 도표실</div>' +
      '<h2>도표에서 각 반응의 에너지 변화를 읽어 비밀번호를 완성하라</h2>' +
      '<p class="lead">세로축 H는 물질이 가진 에너지를 나타내는 가상의 눈금이다. 반응이 진행되면 반응물에서 생성물로 에너지 수준이 바뀐다. 이 변화량을 ΔH라고 쓴다. 부호까지 정확히 입력한다.</p>' +
      '<div class="diagrams">' + diagram('반응 A', 150, 60) + diagram('반응 B', 40, 110) + '</div>' +
      '<div class="fields">' +
        '<div class="field"><label for="ia">반응 A의 ΔH (kJ)</label><input class="inp" id="ia" type="text" inputmode="text" autocomplete="off" placeholder="예: -30"></div>' +
        '<div class="field"><label for="ib">반응 B의 ΔH (kJ)</label><input class="inp" id="ib" type="text" inputmode="text" autocomplete="off" placeholder="예: +30"></div>' +
      '</div>' +
      '<div class="row"><button class="btn" type="button" data-act="check2">비밀번호 입력</button></div>' +
      '<div class="fb" id="fb2" hidden></div>' +
      hintBlock() +
      '</section>';
  }

  function stage3() {
    return '<section class="panel">' +
      '<div class="tag t-mint">잠금 3 · 실험 기록 보관실</div>' +
      '<h2>수소가 연소할 때 방출하는 열을 기록한 자료를 해석하라</h2>' +
      '<div class="tbl-wrap"><table>' +
        '<thead><tr><th>실험</th><th>반응</th><th>반응하는 H<sub>2</sub></th><th>측정 결과</th></tr></thead>' +
        '<tbody>' +
        '<tr><td>(가)</td><td class="eq">H<sub>2</sub>(g) + ½O<sub>2</sub>(g) → H<sub>2</sub>O(l)</td><td>1몰</td><td>286 kJ 방출</td></tr>' +
        '<tr><td>(나)</td><td class="eq">H<sub>2</sub>(g) + ½O<sub>2</sub>(g) → H<sub>2</sub>O(g)</td><td>1몰</td><td>242 kJ 방출</td></tr>' +
        '<tr><td>(다)</td><td class="eq">2H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2H<sub>2</sub>O(l)</td><td>2몰</td><td class="q">ΔH = ?</td></tr>' +
        '</tbody></table></div>' +
      '<div class="stack"><h3>질문 1</h3>' +
        '<p style="font-weight:700">(가)와 (나)는 같은 반응물 1몰이 반응했는데 방출한 열이 다르다. 가장 알맞은 이유는?</p>' +
        '<div class="opts" role="radiogroup" aria-label="방출 열이 다른 이유">' +
          '<label class="opt"><input type="radio" name="q31" value="a"><span>온도계의 눈금이 달랐기 때문이다.</span></label>' +
          '<label class="opt"><input type="radio" name="q31" value="b"><span>생성물인 물의 상태가 달랐기 때문이다.</span></label>' +
          '<label class="opt"><input type="radio" name="q31" value="c"><span>반응하는 수소의 양이 달랐기 때문이다.</span></label>' +
          '<label class="opt"><input type="radio" name="q31" value="d"><span>산소의 색깔이 달랐기 때문이다.</span></label>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label for="i3">질문 2. (다)의 ΔH (kJ)</label><input class="inp" id="i3" type="text" inputmode="text" autocomplete="off" placeholder="부호까지 입력"></div>' +
      '<div class="row"><button class="btn" type="button" data-act="check3">열쇠 확인</button></div>' +
      '<div class="fb" id="fb3" hidden></div>' +
      hintBlock() +
      '</section>';
  }

  function sel(id, opts) {
    return '<select id="' + id + '" aria-label="빈칸 선택"><option value="">선택</option>' +
      opts.map(function (o, i) { return '<option value="' + i + '">' + o + '</option>'; }).join('') + '</select>';
  }

  function stage4() {
    return '<section class="panel">' +
      '<div class="tag t-yellow">최종 문 · 규칙 완성</div>' +
      '<h2>지금까지 직접 찾아낸 규칙을 완성하면 문이 열린다</h2>' +
      '<div class="stack">' +
        '<div class="sent"><span class="no">규칙 1</span> 발열 반응에서는 반응물보다 생성물의 엔탈피(H)가 ' + sel('f0', ['크다', '작다']) + '. 따라서 ΔH의 부호는 ' + sel('f1', ['(+)', '(−)']) + '이다.</div>' +
        '<div class="sent"><span class="no">규칙 2</span> 흡열 반응에서 ΔH의 부호는 ' + sel('f2', ['(+)', '(−)']) + '이다.</div>' +
        '<div class="sent"><span class="no">규칙 3</span> 반응하는 물질의 양이 2배가 되면 ΔH는 ' + sel('f3', ['절반이 된다', '그대로이다', '2배가 된다']) + '.</div>' +
        '<div class="sent"><span class="no">규칙 4</span> 반응식에 ΔH를 함께 쓸 때는 물질의 ' + sel('f4', ['색깔', '상태', '밀도']) + '를 (g), (l) 등으로 반드시 표시해야 한다.</div>' +
      '</div>' +
      '<div class="row"><button class="btn" type="button" data-act="check4">문 열기</button></div>' +
      '<div class="fb" id="fb4" hidden></div>' +
      hintBlock() +
      '</section>';
  }

  function stageClear() {
    var secs = Math.max(0, Math.floor((state.end - state.start) / 1000));
    var terms = ['발열 반응', '흡열 반응', '엔탈피 H', '엔탈피 변화 ΔH', '열화학 반응식'].map(function (t, i) {
      return '<span class="term" style="--i:' + i + '">' + t + '</span>';
    }).join('');
    return '<section class="panel">' +
      '<div class="tag t-mint">탈출 성공</div>' +
      '<div class="clearhead"><h2>문이 열렸다. 방금 완성한 규칙을 한 줄로 쓰면 이렇게 된다.</h2></div>' +
      '<div class="eqbox">2H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2H<sub>2</sub>O(l) &nbsp; ΔH = −572 kJ</div>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + fmt(secs) + '</b><span>걸린 시간</span></div>' +
        '<div class="stat"><b>' + state.hints + '</b><span>사용한 힌트</span></div>' +
      '</div>' +
      '<div class="stack"><h3>이번 단원에서 이름을 붙일 것들</h3><div class="terms">' + terms + '</div></div>' +
      '<div class="stack"><h3>이번 단원에서 풀어 볼 질문</h3>' +
        '<ol class="qs">' +
          '<li>도표의 ‘반응물 150, 생성물 60’은 가상의 값이었다. 실제로는 어떤 값을 측정할 수 있을까?</li>' +
          '<li>방출하거나 흡수한 열은 실험실에서 어떻게 측정할까?</li>' +
          '<li>직접 측정하기 어려운 반응의 ΔH는 구할 수 있을까?</li>' +
        '</ol>' +
      '</div>' +
      '<div class="row"><button class="btn" type="button" data-act="restart">다시 도전</button></div>' +
      '</section>';
  }

  function render() {
    renderGauge();
    var s = state.stage;
    main.innerHTML = s === 'intro' ? stageIntro() : s === 1 ? stage1() : s === 2 ? stage2() :
      s === 3 ? stage3() : s === 4 ? stage4() : stageClear();
    var v = document.getElementById('vault');
    if (v) v.classList.toggle('open', s === 'clear');
  }

  function unlock(n, msg, fbEl) {
    state.opened = Math.max(state.opened, n);
    state.pop = n - 1;
    renderGauge();
    var next = n === 4 ? '탈출하기' : '다음 잠금으로';
    fb(fbEl, 'ok', '<div class="okrow">' + padlock(true) + '<div class="msg">' + msg + '</div>' +
      '<button class="btn go" type="button" data-act="next' + n + '">' + next + '</button></div>');
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = document.getElementById('cf'), ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    var cols = ['#ffd93d', '#ff5a2c', '#3d8bff', '#38e0a0', '#ff7ab8', '#0b0b12'];
    var ps = [];
    for (var i = 0; i < 150; i++) {
      ps.push({ x: c.width / 2 + (Math.random() - 0.5) * 120, y: c.height * 0.6, vx: (Math.random() - 0.5) * 18, vy: -Math.random() * 17 - 5,
        s: 7 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] });
    }
    var f = 0;
    (function loop() {
      ctx.clearRect(0, 0, c.width, c.height);
      ps.forEach(function (p) {
        p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
        ctx.lineWidth = 2; ctx.strokeStyle = '#0b0b12'; ctx.strokeRect(-p.s / 2, -p.s / 2, p.s, p.s);
        ctx.restore();
      });
      if (++f < 200) requestAnimationFrame(loop); else ctx.clearRect(0, 0, c.width, c.height);
    })();
  }

  /* ---------- actions ---------- */
  var actions = {
    start: function () {
      state.start = Date.now(); state.end = 0;
      clearInterval(timerId);
      timerId = setInterval(tickTimer, 1000);
      tickTimer();
      go(1);
    },
    hint: function () { showHint(state.stage); },
    check1: function () {
      var wrong = 0, blank = 0;
      CARDS.forEach(function (c, i) {
        var r = $('input[name="c' + i + '"]:checked');
        var card = document.getElementById('card' + i);
        card.classList.remove('wrong', 'right');
        if (!r) { blank++; return; }
        var ans = K.c.charAt(i) === 'X' ? 'exo' : 'endo';
        if (r.value === ans) { card.classList.add('right'); } else { void card.offsetWidth; card.classList.add('wrong'); wrong++; }
      });
      var f = $('#fb1');
      if (blank) { fb(f, 'bad', '아직 분류하지 않은 카드가 ' + blank + '개 있다.'); return; }
      if (wrong) { fb(f, 'bad', wrong + '개가 맞지 않는다. 붉게 표시된 카드의 관찰 결과를 다시 읽어 보자.'); return; }
      fb(f, 'ok', '여섯 가지 모두 맞게 분류했다. 아래 추가 질문에 답하면 잠금이 풀린다.');
      document.querySelectorAll('.seg input').forEach(function (x) { x.disabled = true; });
      $('#partB').hidden = false;
    },
    checkB: function () {
      var r = $('input[name="pb"]:checked'); var f = $('#fbB');
      if (!r) { fb(f, 'bad', '하나를 선택하자.'); return; }
      if (r.value === K.pb) {
        unlock(1, '맞다. 열이 주변으로 나간 만큼 물질이 가진 에너지는 줄어든다. 잠금 1이 열렸다.', f);
      } else if (r.value === 'up') {
        fb(f, 'bad', '핫팩은 주변을 데운다. 열이 밖으로 나갔는데 물질의 에너지가 늘어날 수 있을까?');
      } else {
        fb(f, 'bad', '열이 밖으로 나갔다. 그 에너지는 어디에서 왔을까?');
      }
    },
    check2: function () {
      var a = parseNum($('#ia').value), b = parseNum($('#ib').value), f = $('#fb2');
      var ia = $('#ia'), ib = $('#ib');
      ia.className = 'inp'; ib.className = 'inp';
      if (isNaN(a) || isNaN(b)) { fb(f, 'bad', '두 칸 모두 숫자로 입력하자. 예: -30, +30'); return; }
      var okA = a === K.a[0], okB = b === K.a[1];
      ia.classList.add(okA ? 'good' : 'badv'); ib.classList.add(okB ? 'good' : 'badv');
      if (okA && okB) { unlock(2, '두 값이 모두 맞다. 에너지가 줄어든 반응 A는 ΔH가 (−), 늘어난 반응 B는 ΔH가 (+)이다. 잠금 2가 열렸다.', f); return; }
      var signOnly = (Math.abs(a) === Math.abs(K.a[0]) && !okA) || (Math.abs(b) === Math.abs(K.a[1]) && !okB);
      if (signOnly) fb(f, 'bad', '크기는 맞는 값이 있다. 부호를 다시 생각해 보자. 화살표는 아래로 내려갔는가, 올라갔는가?');
      else fb(f, 'bad', '맞지 않는다. 반응물과 생성물의 눈금을 눈금선에서 정확히 읽고, 나중 값에서 처음 값을 빼 보자.');
    },
    check3: function () {
      var q = $('input[name="q31"]:checked'), v = parseNum($('#i3').value), f = $('#fb3');
      var inp = $('#i3'); inp.className = 'inp';
      if (!q) { fb(f, 'bad', '질문 1의 답을 선택하자.'); return; }
      if (q.value !== K.q) { fb(f, 'bad', '질문 1이 맞지 않는다. (가)와 (나)에서 반응물은 같고 생성물 H<sub>2</sub>O의 무엇이 다른지 보자.'); return; }
      if (isNaN(v)) { fb(f, 'bad', '질문 2의 값을 숫자로 입력하자.'); return; }
      if (v === K.r) {
        inp.classList.add('good');
        unlock(3, '맞다. 상태가 같은 (가)에서 H<sub>2</sub> 1몰이 반응할 때 −286 kJ이므로, 2몰이 반응하면 −572 kJ이다. 잠금 3이 열렸다.', f);
      } else if (v === -K.r) {
        inp.classList.add('badv'); fb(f, 'bad', '크기는 맞다. 이 반응은 열을 방출한다. 부호를 어떻게 붙일지 잠금 2에서 찾은 규칙을 떠올리자.');
      } else if (Math.abs(v) === 286) {
        inp.classList.add('badv'); fb(f, 'bad', '(다)에서는 H<sub>2</sub>가 몇 몰 반응하는지 다시 세어 보자.');
      } else {
        inp.classList.add('badv'); fb(f, 'bad', '맞지 않는다. (가)의 값과 반응하는 H<sub>2</sub>의 몰 수를 이용해 보자.');
      }
    },
    check4: function () {
      var wrong = 0, blank = 0;
      K.f.forEach(function (ans, i) {
        var s = document.getElementById('f' + i);
        s.classList.remove('wrongsel', 'rightsel');
        if (s.value === '') { blank++; return; }
        if (Number(s.value) === ans) s.classList.add('rightsel'); else { void s.offsetWidth; s.classList.add('wrongsel'); wrong++; }
      });
      var f = $('#fb4');
      if (blank) { fb(f, 'bad', '비어 있는 칸이 ' + blank + '개 있다.'); return; }
      if (wrong) { fb(f, 'bad', wrong + '칸이 맞지 않는다. 붉게 표시된 칸을 앞의 잠금에서 얻은 결과와 비교하자.'); return; }
      state.end = Date.now();
      clearInterval(timerId);
      unlock(4, '모든 규칙이 맞다. 문이 열린다.', f);
    },
    next1: function () { go(2); },
    next2: function () { go(3); },
    next3: function () { go(4); },
    next4: function () { go('clear'); confetti(); },
    restart: function () { reset(); }
  };

  main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var fn = actions[t.getAttribute('data-act')];
    if (fn) fn();
  });

  function reset() {
    clearInterval(timerId);
    state = { stage: 'intro', opened: 0, hints: 0, start: 0, end: 0, hintIdx: {}, pop: -1 };
    var el = document.getElementById('timer');
    el.textContent = fmt(LIMIT); el.classList.remove('over', 'warn');
    render();
  }
  document.getElementById('rbtn').addEventListener('click', reset);

  document.getElementById('timer').textContent = fmt(LIMIT);
  render();
})();
</script>

</body>
</html>
